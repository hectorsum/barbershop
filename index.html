<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fernando — Barbero & Tatuajes</title>
  <style>
    /* Page transition */
    .page-enter {
      animation: pageIn 0.35s ease both;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--espresso); }
    ::-webkit-scrollbar-thumb { background: var(--mid-brown); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--warm-tan); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
